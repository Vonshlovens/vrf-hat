name: CI / Deploy

# Pull requests run the checks; pushes to main run them and then deploy the
# Worker to vrf-hat.ericevans.dev. Database migrations stay manual.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# src/env.ts marks these required and SvelteKit validates them at build time.
# Nothing is prerendered and the values are not inlined: the Worker reads the
# real ones from its secrets and vars at runtime.
env:
  DATABASE_URL: postgres://build:placeholder@localhost/build
  ORIGIN: https://vrf-hat.ericevans.dev
  BETTER_AUTH_SECRET: build-placeholder

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and lint
        run: pnpm exec vp check
      - name: Type check
        run: pnpm run check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vrf-hat.ericevans.dev
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Deploy
        run: pnpm exec wrangler deploy --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
